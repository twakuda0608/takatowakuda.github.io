<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>SVG TextPath Orientation Test</title>
<style>
  body { font-family: sans-serif; background: #f8fafc; padding: 20px; }
  svg { background: white; border: 1px solid #ccc; margin: 10px; }
  text { font-size: 14px; fill: #1e293b; font-weight: bold; }
  path { stroke: #3b82f6; stroke-width: 2; fill: none; }
</style>
</head>
<body>
<h2>SVG textPath 角度別レンダリング検証</h2>
<div id="container"></div>

<script>
const angles = [
  { name: "0° (西→東)", dx: 100, dy: 0 },
  { name: "45° (北西→南東)", dx: 70, dy: 70 },
  { name: "90° (北→南 / 上→下)", dx: 0, dy: 100 },
  { name: "135° (北東→南西)", dx: -70, dy: 70 },
  { name: "180° (東→西)", dx: -100, dy: 0 },
  { name: "225° (南東→北西)", dx: -70, dy: -70 },
  { name: "270° (南→北 / 下→上)", dx: 0, dy: -100 },
  { name: "315° (南西→北東)", dx: 70, dy: -70 }
];

const container = document.getElementById('container');

angles.forEach((item, idx) => {
  const div = document.createElement('div');
  div.style.display = 'inline-block';
  div.style.textAlign = 'center';

  const title = document.createElement('div');
  title.textContent = item.name;
  div.appendChild(title);

  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('width', '180');
  svg.setAttribute('height', '180');
  svg.setAttribute('viewBox', '0 0 180 180');

  const cx = 90, cy = 90;
  const x1 = cx - item.dx / 2;
  const y1 = cy - item.dy / 2;
  const x2 = cx + item.dx / 2;
  const y2 = cy + item.dy / 2;

  const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  const pathId = 'path-' + idx;
  path.setAttribute('id', pathId);
  path.setAttribute('d', `M ${x1} ${y1} L ${x2} ${y2}`);
  svg.appendChild(path);

  // 矢印マーカー（進行方向）
  const marker = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
  marker.setAttribute('cx', x2);
  marker.setAttribute('cy', y2);
  marker.setAttribute('r', '4');
  marker.setAttribute('fill', 'red');
  svg.appendChild(marker);

  const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
  const textPath = document.createElementNS('http://www.w3.org/2000/svg', 'textPath');
  textPath.setAttribute('href', '#' + pathId);
  textPath.setAttribute('startOffset', '50%');
  textPath.setAttribute('text-anchor', 'middle');
  textPath.textContent = '日光線 (テスト)';
  text.appendChild(textPath);
  svg.appendChild(text);

  div.appendChild(svg);
  container.appendChild(div);
});
</script>
</body>
</html>
