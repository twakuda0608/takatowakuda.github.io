<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>JR 路線図 | Takato Wakuda</title>

  <!-- Leaflet Local CSS & JS for Testing -->
  <link rel="stylesheet" href="leaflet.css">
  <script src="leaflet.js"></script>
  <script>
    console.error("DEBUG_L: typeof L = " + typeof L + ", typeof leaflet = " + typeof leaflet + ", window.L = " + typeof window.L);
  </script>

  <!-- Common & Local Styles -->
  <link rel="stylesheet" href="/common.css">
  <link rel="stylesheet" href="../style.css">
</head>
<body class="theme-light">
  <div id="app">
    <div id="map"></div>

    <header class="map-header">
      <div class="header-left">
        <div class="site-branding">
          <span class="badge-jr">JR</span>
          <h1 class="header-title">路線図</h1>
        </div>
      </div>

      <div class="header-search">
        <div class="search-box">
          <svg class="search-icon" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
            <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2" fill="none"/>
            <line x1="16" y1="16" x2="21" y2="21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
          <input type="text" id="station-search" placeholder="駅名を検索 (例: 新宿, tokyo)" autocomplete="off">
          <button type="button" id="search-clear" class="btn-icon" aria-label="消去" style="display:none;">✕</button>
        </div>
        <div id="search-results" class="search-dropdown" style="display: none;"></div>
      </div>

      <button type="button" id="btn-toggle-route" class="btn-route-toggle" title="マルス経路探索">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="6" cy="19" r="3"/>
          <path d="M9 19h8.5a4.5 4.5 0 0 0 0-9H7a3 3 0 0 1 0-6h11"/>
          <circle cx="18" cy="5" r="3"/>
        </svg>
        <span>経路探索</span>
      </button>
    </header>

    <div class="map-controls">
      <div class="control-group">
        <button type="button" id="btn-zoom-in" class="ctrl-btn" title="拡大" aria-label="拡大">
          <svg viewBox="0 0 24 24" width="18" height="18"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
        <button type="button" id="btn-zoom-out" class="ctrl-btn" title="縮小" aria-label="縮小">
          <svg viewBox="0 0 24 24" width="18" height="18"><path d="M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
        <button type="button" id="btn-zoom-reset" class="ctrl-btn" title="全体表示" aria-label="全体表示">
          <svg viewBox="0 0 24 24" width="18" height="18"><circle cx="12" cy="12" r="3" fill="currentColor"/><circle cx="12" cy="12" r="8" stroke="currentColor" stroke-width="2" fill="none"/></svg>
        </button>
      </div>
    </div>

    <div id="station-sheet" class="station-sheet" style="display: none;">
      <div class="sheet-handle" id="sheet-handle"></div>
      <button type="button" class="btn-sheet-close" id="btn-sheet-close" aria-label="閉">✕</button>
      <div class="sheet-header">
        <div class="station-meta">
          <span class="station-pref" id="sheet-pref">東京都</span>
          <span class="station-kana" id="sheet-kana">とうきょう</span>
          <span class="station-en" id="sheet-en">Tokyo</span>
        </div>
        <h2 class="station-name" id="sheet-name">東京</h2>
      </div>
      <div class="sheet-body">
        <div class="section-title">乗り入れ路線</div>
        <div class="station-lines" id="sheet-lines"></div>
        <div class="section-title">隣接駅</div>
        <div class="adjacent-stations" id="sheet-adjacents"></div>
        <div class="sheet-actions">
          <button type="button" class="btn-primary" id="btn-focus-station">中央表示</button>
          <button type="button" class="btn-secondary btn-route-action" id="btn-set-dept">発駅設定</button>
          <button type="button" class="btn-secondary btn-route-action" id="btn-add-via">経由追加</button>
          <button type="button" class="btn-secondary btn-route-action" id="btn-set-dest">着駅設定</button>
        </div>
      </div>
    </div>

    <div id="route-panel" class="route-panel" style="display: none;">
      <div class="route-panel-header">
        <div class="route-panel-title"><span>マルス経路探索</span></div>
        <button type="button" class="btn-panel-close" id="btn-close-route" aria-label="閉">✕</button>
      </div>
      <div class="route-panel-body">
        <div class="route-inputs">
          <div class="route-input-row dept-row">
            <span class="route-node-icon dept-icon">発</span>
            <div class="route-field-wrapper">
              <input type="text" id="route-dept-input" class="route-station-input" placeholder="発駅名" autocomplete="off">
              <button type="button" class="btn-input-clear" data-target="route-dept-input" aria-label="消去" tabindex="-1">✕</button>
              <div class="route-suggest-dropdown" id="route-dept-suggest" style="display:none;"></div>
            </div>
          </div>
          <div id="route-via-container" class="route-via-container"></div>
          <div class="route-input-row dest-row">
            <span class="route-node-icon dest-icon">着</span>
            <div class="route-field-wrapper">
              <input type="text" id="route-dest-input" class="route-station-input" placeholder="着駅名" autocomplete="off">
              <button type="button" class="btn-input-clear" data-target="route-dest-input" aria-label="消去" tabindex="-1">✕</button>
              <div class="route-suggest-dropdown" id="route-dest-suggest" style="display:none;"></div>
            </div>
          </div>
          <div class="route-add-via-row">
            <button type="button" id="btn-add-via-field" class="btn-text-action">＋ 経由駅追加</button>
          </div>
        </div>
        <div class="route-options-container">
          <div class="route-mode-group" id="route-mode-selector">
            <button type="button" class="route-mode-btn active" data-mode="shortest" id="btn-mode-shortest">最短経路</button>
            <button type="button" class="route-mode-btn" data-mode="oneway" id="btn-mode-oneway">重複区間なし</button>
          </div>
          <div class="route-options">
            <label class="route-checkbox-label">
              <input type="checkbox" id="chk-use-shinkansen" checked>
              <span>新幹線利用</span>
            </label>
            <button type="button" id="btn-toggle-shinkansen-segments" class="btn-text-action">特定区間新幹線指定 ▼</button>
          </div>
          <div id="shinkansen-segments-panel" class="shinkansen-segments-panel" style="display: none;">
            <div class="shinkansen-segments-header">
              <span class="shinkansen-panel-label">新幹線乗車区間 (タップで指定/解除)</span>
            </div>
            <div id="shinkansen-candidate-container" class="shinkansen-candidate-container">
              <div id="shinkansen-candidate-chips" class="shinkansen-candidate-chips"></div>
            </div>
            <div id="shinkansen-segments-list" class="shinkansen-segments-list" style="display: none;"></div>
            <details class="shinkansen-custom-details">
              <summary class="shinkansen-custom-summary">その他の区間を手動指定</summary>
              <div class="shinkansen-add-row">
                <div class="shinkansen-input-wrapper">
                  <input type="text" id="shinkansen-from-input" class="route-station-input" placeholder="乗車駅" autocomplete="off">
                  <div class="route-suggest-dropdown" id="shinkansen-from-suggest" style="display:none;"></div>
                </div>
                <button type="button" id="btn-swap-shinkansen-inputs" class="btn-swap-shinkansen" title="乗車駅と降車駅を入れ替え" aria-label="乗車駅と降車駅を入れ替え">⇄</button>
                <div class="shinkansen-input-wrapper">
                  <input type="text" id="shinkansen-to-input" class="route-station-input" placeholder="降車駅" autocomplete="off">
                  <div class="route-suggest-dropdown" id="shinkansen-to-suggest" style="display:none;"></div>
                </div>
                <button type="button" id="btn-add-shinkansen-seg" class="btn-secondary btn-sm">追加</button>
              </div>
            </details>
          </div>
        </div>
        <div class="route-buttons">
          <button type="button" id="btn-search-route" class="btn-search-route">経路探索</button>
          <button type="button" id="btn-clear-route" class="btn-clear-route">クリア</button>
        </div>
        <div id="route-result-container" class="route-result-container" style="display: none;">
          <div class="mars-ticket-card">
            <div class="ticket-header">
              <span class="ticket-type" id="ticket-type-label">普通乗車券</span>
              <span class="ticket-status-badge" id="route-validity-badge">一筆書き成立</span>
            </div>
            <div class="ticket-stations-row">
              <span class="ticket-dept" id="ticket-dept-name">東京</span>
              <span class="ticket-arrow">→</span>
              <span class="ticket-dest" id="ticket-dest-name">新宿</span>
            </div>
            <div class="ticket-via-block">
              <div class="ticket-via-label">経由</div>
              <div class="ticket-via-text" id="ticket-via-text">中央東</div>
            </div>
            <div class="ticket-fare-block" id="ticket-fare-block">
              <span class="fare-label">運賃:</span>
              <span class="fare-value" id="ticket-base-fare">260円</span>
            </div>
            <div class="ticket-rules-block">
              <div class="rule-badge-row">
                <span class="rule-badge" id="ticket-validity-badge">2日間有効</span>
                <span class="rule-badge" id="ticket-stopover-badge">途中下車可能</span>
              </div>
            </div>
            <div class="ticket-footer-row">
              <span class="ticket-kilo" id="ticket-total-kilo">営業キロ: 10.3 km</span>
              <button type="button" class="btn-copy-ticket" id="btn-copy-ticket">コピー</button>
            </div>
          </div>
          <div class="route-details-section">
            <div class="route-details-title">通過路線・接続駅</div>
            <div id="route-sections-list" class="route-sections-list"></div>
          </div>
        </div>
        <div id="route-error-msg" class="route-error-msg" style="display: none;"></div>
      </div>
    </div>

    <div id="line-banner" class="line-banner" style="display: none;">
      <div class="line-badge" id="banner-badge">JY</div>
      <div class="line-details">
        <div class="line-name-row">
          <strong id="banner-name">山手線</strong>
          <span id="banner-en">Yamanote Line</span>
        </div>
        <p class="line-desc" id="banner-desc"></p>
      </div>
      <button type="button" class="btn-banner-close" id="btn-banner-close" aria-label="閉">✕</button>
    </div>

    <div class="map-legend">
      <div class="legend-item"><span class="legend-dot hub"></span> 主要ターミナル駅</div>
      <div class="legend-item"><span class="legend-dot regular"></span> 駅</div>
      <div class="legend-item"><span class="legend-line shinkansen"></span> 新幹線</div>
      <div class="legend-item"><span class="legend-line local"></span> 在来線</div>
      <div class="legend-item"><span class="legend-line border-line"></span> 県境</div>
    </div>
  </div>

  <script src="../topojson-client.min.js"></script>
  <script src="../data/borders.js"></script>
  <script src="../data/build-data.js"></script>
  <script src="../data/official-kilos.js"></script>
  <script src="../data/tracks.js"></script>
  <script src="../fare-engine.js"></script>
  <script src="../route-engine.js"></script>
  <script src="../app.js"></script>
</body>
</html>
